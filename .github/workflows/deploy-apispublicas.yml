name: Deploy APIsPublicas

on:
  push:
    branches:
      - main
    paths:
      - 'APIsPublicas/**'
      - '.github/workflows/deploy-apispublicas.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Garantir diretórios do Laravel
        run: |
          mkdir -p APIsPublicas/bootstrap/cache
          mkdir -p APIsPublicas/storage/framework/cache
          mkdir -p APIsPublicas/storage/framework/sessions
          mkdir -p APIsPublicas/storage/framework/views
          mkdir -p APIsPublicas/storage/logs
          chmod -R 775 APIsPublicas/bootstrap/cache
          chmod -R 775 APIsPublicas/storage

      - name: Instalar dependências front
        working-directory: APIsPublicas
        run: npm install

      - name: Build assets
        working-directory: APIsPublicas
        run: npm run build

      - name: Verificar manifest
        run: |
          echo "==== MANIFEST ===="
          cat APIsPublicas/public/build/manifest.json

      - name: Montar estrutura
        run: |
          rm -rf deploy
          mkdir -p deploy/apispublicas_laravel
          mkdir -p deploy/public_html/apispublicas

          rsync -av \
            --exclude='public' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='.env' \
            --exclude='vendor' \
            APIsPublicas/ deploy/apispublicas_laravel/

          rsync -av --delete APIsPublicas/public/ deploy/public_html/apispublicas/

      - name: Ajustar index.php
        run: |
          cat > deploy/public_html/apispublicas/index.php <<'PHP'
          <?php

          use Illuminate\Http\Request;

          define('LARAVEL_START', microtime(true));

          $basePath = realpath(__DIR__ . '/../../apispublicas_laravel');

          if ($basePath === false) {
              die('Base path não encontrado.');
          }

          require $basePath . '/vendor/autoload.php';

          if (file_exists($maintenance = $basePath . '/storage/framework/maintenance.php')) {
              require $maintenance;
          }

          $app = require_once $basePath . '/bootstrap/app.php';

          $app->usePublicPath(__DIR__);

          $app->handleRequest(Request::capture());
          PHP

      - name: Deploy FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER_APISPUBLICAS }}
          username: ${{ secrets.FTP_USERNAME_APISPUBLICAS }}
          password: ${{ secrets.FTP_PASSWORD_APISPUBLICAS }}
          local-dir: ./deploy/
          server-dir: /
          exclude: |
            **/.git*
            **/.github*
            **/node_modules/**
            **/tests/**
            **/.env
            **/vendor/**