name: Deploy GestaoClientes

on:
  push:
    branches:
      - main
    paths:
      - 'GestaoClientes/**'
      - '.github/workflows/deploy-gestaoclientes.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      # ===== NODE =====
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências front
        working-directory: GestaoClientes
        run: npm install

      - name: Build assets
        working-directory: GestaoClientes
        run: npm run build

      # ===== PHP =====
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Instalar dependências PHP
        working-directory: GestaoClientes
        run: composer install --no-dev --optimize-autoloader

      # ===== PREPARAR =====
      - name: Montar estrutura
        run: |
          mkdir -p deploy/gestaoclientes_laravel
          mkdir -p deploy/public_html

          rsync -av --delete \
            --exclude='public' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='.env' \
            GestaoClientes/ deploy/gestaoclientes_laravel/

          rsync -av GestaoClientes/public/ deploy/public_html/

      # ===== INDEX =====
      - name: Ajustar index.php
        run: |
          cat > deploy/public_html/index.php <<'PHP'
          <?php

          use Illuminate\Http\Request;

          define('LARAVEL_START', microtime(true));

          $basePath = realpath(__DIR__ . '/../gestaoclientes_laravel');

          if ($basePath === false) {
              die('Base path não encontrado.');
          }

          require $basePath . '/vendor/autoload.php';

          if (file_exists($maintenance = $basePath . '/storage/framework/maintenance.php')) {
              require $maintenance;
          }

          $app = require_once $basePath . '/bootstrap/app.php';

          $app->usePublicPath(__DIR__);

          $app->handleRequest(Request::capture());
          PHP

      # ===== FTP =====
      - name: Deploy FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER_GESTAO }}
          username: ${{ secrets.FTP_USERNAME_GESTAO }}
          password: ${{ secrets.FTP_PASSWORD_GESTAO }}
          local-dir: ./deploy/
          server-dir: /
          exclude: |
            **/.git*
            **/.github*
            **/node_modules/**
            **/tests/**
            **/.env